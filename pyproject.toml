[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ai"
version = "0.1.0"
description = "AI and LLM exploration project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain Core
    "langchain",
    "langchain-core",

    # OpenAI Integration
    "langchain-openai",
    "openai",

    # Anthropic Integration
    "langchain-anthropic",

    # Google Gemini (PaLM) Integration
    "langchain-google-genai",
    "google-generativeai",

    # Hugging Face Integration
    "langchain-huggingface",
    "transformers",
    "huggingface-hub",

    # Environment Variable Management
    "python-dotenv",

    # Machine Learning Utilities
    "numpy",
    "scikit-learn",
]
